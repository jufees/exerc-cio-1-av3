<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        h2 {
            text-align: center;
            color: #000c64;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .campo {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            border: none;
            border-bottom: 1px solid #ddd;
            padding: 8px;
            outline: none;
            font-size: 12px;
            background: transparent;
        }
        input:focus,
        select:focus {
            border-bottom: 1px solid #4b2c4b;
        }
        .termos {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 18px 0;
        }
        .termos label {
            margin: 0;
            font-weight: normal;
            font-size: 13px;
        }
        button {
            width: 100%;
            padding: 9px;
            background-color: #000c64;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #382038;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Formulário de Cadastro de Aluno</h2>
        <form action="cadastro.php" method="POST">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>
            
            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade" min="1" max="120" placeholder="Digite sua idade" required>
            </div>
            
            <div class="campo">
                <label for="curso">Turma</label>
                <select name="curso" id="curso" required>
                    <option value="">Selecione sua turma</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            
            <div class="termos">
                <input type="checkbox" id="termos" name="termos" value="sim" required>
                <label for="termos">Eu concordo com os termos e condições</label>
            </div>
            
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
